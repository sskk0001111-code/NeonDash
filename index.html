<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Color Dash</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #05050a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 420px;
      max-height: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at 50% 50%, #0c0d1e 0%, #030308 100%);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
    }
    .hud-text {
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.7);
    }
    #score-val {
      font-size: 38px;
    }
    #high-score-val {
      font-size: 15px;
      color: #00f3ff;
      opacity: 0.9;
    }
    #game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 10, 0.88);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }
    .game-over-title {
      font-size: 34px;
      font-weight: 900;
      color: #ff007f;
      text-shadow: 0 0 18px rgba(255, 0, 127, 0.8);
      letter-spacing: 2px;
    }
    .stats-label {
      color: #fff;
      font-size: 18px;
      font-weight: 600;
    }
    .action-prompt {
      margin-top: 15px;
      font-size: 14px;
      color: #00f3ff;
      letter-spacing: 1px;
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
      <div>
        <div class="hud-text" id="score-val">0</div>
        <div class="hud-text" id="high-score-val">TOP: --</div>
      </div>
    </div>

    <div id="game-over-screen">
      <div class="game-over-title">CRASHED!</div>
      <div class="stats-label" id="final-score-val">SCORE: 0</div>
      <div class="stats-label" id="leaderboard-status" style="font-size: 13px; color: #aaa;">Syncing Score...</div>
      <div class="action-prompt">TAP ANYWHERE TO REPLAY</div>
    </div>
  </div>

  <script>
    // --- SUPABASE CLIENT CONFIG ---
    const SUPABASE_URL = "https://mgymflakbdrqviutkdhq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_zFgsgiqHo6rrNAj8KAX1FQ_Fq3rHP6-";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreVal = document.getElementById("score-val");
    const highScoreVal = document.getElementById("high-score-val");
    const gameOverScreen = document.getElementById("game-over-screen");
    const finalScoreVal = document.getElementById("final-score-val");
    const lbStatus = document.getElementById("leaderboard-status");

    const V_WIDTH = 360;
    const V_HEIGHT = 640;
    canvas.width = V_WIDTH;
    canvas.height = V_HEIGHT;

    const NEON_COLORS = [
      { hex: "#ff007f", glow: "rgba(255, 0, 127, 0.6)" }, // Pink
      { hex: "#00f3ff", glow: "rgba(0, 243, 255, 0.6)" }, // Cyan
      { hex: "#ffe600", glow: "rgba(255, 230, 0, 0.6)" }  // Yellow
    ];

    let player = {
      x: V_WIDTH / 2,
      y: V_HEIGHT - 90,
      radius: 22,
      colorIndex: 0,
      scalePunch: 1.0
    };

    let obstacles = [];
    let particles = [];
    let score = 0;
    let globalHighScore = 0;
    let baseSpeed = 4.2;
    let spawnTimer = 0;
    let isGameOver = false;

    // --- LEADERBOARD LOGIC ---
    async function fetchGlobalTopScore() {
      try {
        const { data, error } = await supabaseClient
          .from("leaderboard")
          .select("score")
          .order("score", { ascending: false })
          .limit(1);

        if (!error && data && data.length > 0) {
          globalHighScore = data[0].score;
          highScoreVal.innerText = "TOP: " + globalHighScore;
        }
      } catch (e) {
        console.warn("Offline or load error", e);
      }
    }
    fetchGlobalTopScore();

    async function pushScoreToLeaderboard(finalScore) {
      if (finalScore <= 0) {
        lbStatus.innerText = "Score recorded locally";
        return;
      }
      lbStatus.innerText = "Saving to Leaderboard...";
      try {
        const { error } = await supabaseClient
          .from("leaderboard")
          .insert([{ player_name: "Player", score: finalScore }]);
        
        if (!error) {
          lbStatus.innerText = "Score saved online!";
          fetchGlobalTopScore();
        } else {
          lbStatus.innerText = "Offline mode";
        }
      } catch (err) {
        lbStatus.innerText = "Could not sync score";
      }
    }

    // --- INPUT CONTROLS ---
    window.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (isGameOver) {
        restartGame();
        return;
      }
      // Cycle neon color
      player.colorIndex = (player.colorIndex + 1) % NEON_COLORS.length;
      player.scalePunch = 1.28;
    });

    function restartGame() {
      obstacles = [];
      particles = [];
      score = 0;
      baseSpeed = 4.2;
      spawnTimer = 0;
      player.colorIndex = 0;
      scoreVal.innerText = "0";
      gameOverScreen.style.display = "none";
      isGameOver = false;
    }

    function createObstacle() {
      const colorIdx = Math.floor(Math.random() * NEON_COLORS.length);
      obstacles.push({
        x: 25,
        y: -40,
        width: V_WIDTH - 50,
        height: 24,
        colorIndex: colorIdx,
        cleared: false
      });
    }

    function triggerCrash() {
      isGameOver = true;
      finalScoreVal.innerText = "SCORE: " + score;
      gameOverScreen.style.display = "flex";
      pushScoreToLeaderboard(score);
    }

    function createBurst(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = 2 + Math.random() * 5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * vel,
          vy: Math.sin(angle) * vel,
          life: 1.0,
          color: color
        });
      }
    }

    // --- GAME ENGINE LOOP ---
    function update(dt) {
      if (isGameOver) return;

      if (player.scalePunch > 1.0) {
        player.scalePunch = Math.max(1.0, player.scalePunch - 0.04);
      }

      spawnTimer++;
      const currentSpawnDelay = Math.max(55, 95 - Math.floor(score * 0.8));
      if (spawnTimer >= currentSpawnDelay) {
        createObstacle();
        spawnTimer = 0;
      }

      const activeSpeed = baseSpeed + (score * 0.08);

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += activeSpeed;

        // Collision Check (AABB with circle)
        const closestY = Math.max(obs.y, Math.min(player.y, obs.y + obs.height));
        const closestX = Math.max(obs.x, Math.min(player.x, obs.x + obs.width));
        const distX = player.x - closestX;
        const distY = player.y - closestY;

        if ((distX * distX + distY * distY) < (player.radius * player.radius)) {
          if (player.colorIndex === obs.colorIndex) {
            createBurst(player.x, obs.y + obs.height / 2, NEON_COLORS[obs.colorIndex].hex);
            obstacles.splice(i, 1);
            score++;
            scoreVal.innerText = score;
          } else {
            triggerCrash();
            return;
          }
        } else if (obs.y > V_HEIGHT + 60) {
          obstacles.splice(i, 1);
        }
      }

      // Particles update
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.045;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      // Draw Obstacles
      for (const obs of obstacles) {
        const conf = NEON_COLORS[obs.colorIndex];
        ctx.shadowBlur = 16;
        ctx.shadowColor = conf.glow;
        ctx.fillStyle = conf.hex;
        ctx.beginPath();
        ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 12);
        ctx.fill();

        // White core accent
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.fillRect(obs.x + 16, obs.y + obs.height / 2 - 2, obs.width - 32, 4);
      }

      // Draw Particles
      for (const p of particles) {
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.5 * p.life, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Player
      const pConf = NEON_COLORS[player.colorIndex];
      const r = player.radius * player.scalePunch;

      // Outer Glow Aura
      ctx.shadowBlur = 24;
      ctx.shadowColor = pConf.glow;
      ctx.fillStyle = pConf.hex;
      ctx.beginPath();
      ctx.arc(player.x, player.y, r, 0, Math.PI * 2);
      ctx.fill();

      // White Center Bulb
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(player.x, player.y, r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
