<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Magnet Tether - Neon Cyber</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&display=swap');
    
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      touch-action: none; user-select: none; -webkit-user-select: none;
      font-family: 'Orbitron', sans-serif;
    }
    body {
      background: #020108;
      overflow: hidden; display: flex;
      justify-content: center; align-items: center;
      height: 100vh; width: 100vw;
    }
    #game-container {
      position: relative; width: 100%; height: 100%;
      max-width: 420px; max-height: 800px;
      display: flex; justify-content: center; align-items: center;
      background: radial-gradient(circle at 50% 70%, #110524 0%, #020108 100%);
      box-shadow: 0 0 40px rgba(162, 0, 255, 0.2);
    }
    canvas {
      width: 100%; height: 100%; display: block;
    }
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column;
      justify-content: space-between; padding: 30px 20px; z-index: 5;
    }
    .hud-text {
      color: #fff; font-weight: 900; font-size: 42px;
      text-align: center; letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.8), 0 0 30px rgba(0, 243, 255, 0.4);
      animation: floatScore 2s ease-in-out infinite alternate;
    }
    
    /* Menus */
    .menu-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 1, 8, 0.85); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 25px; pointer-events: auto; z-index: 10;
      transition: opacity 0.3s ease;
    }
    .title-text {
      font-size: 38px; font-weight: 900; color: #fff;
      text-shadow: 0 0 10px #a200ff, 0 0 20px #a200ff, 0 0 40px #a200ff;
      letter-spacing: 3px; margin-bottom: 20px; text-align: center;
      animation: pulseTitle 1.5s infinite alternate;
    }
    .game-over-title {
      font-size: 42px; font-weight: 900; color: #ff004c;
      text-shadow: 0 0 15px #ff004c, 0 0 30px #ff004c;
      letter-spacing: 4px; animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
    }
    
    /* Cyber Buttons */
    .btn {
      background: linear-gradient(45deg, transparent 5%, #a200ff 5%);
      border: none; color: #fff; font-size: 16px; font-weight: 800;
      padding: 16px 40px; letter-spacing: 2px; cursor: pointer;
      box-shadow: 6px 0px 0px #00f3ff;
      transition: all 0.2s ease;
      position: relative; outline: transparent;
    }
    .btn:active {
      transform: scale(0.95); box-shadow: 2px 0px 0px #00f3ff;
      background: linear-gradient(45deg, transparent 5%, #8300d1 5%);
    }
    
    .stats-label { color: #fff; font-size: 20px; font-weight: 500; letter-spacing: 2px; }
    
    /* Animations */
    @keyframes floatScore {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
    @keyframes pulseTitle {
      0% { text-shadow: 0 0 10px #a200ff, 0 0 20px #a200ff; }
      100% { text-shadow: 0 0 15px #a200ff, 0 0 30px #00f3ff, 0 0 45px #00f3ff; }
    }
    @keyframes glitch {
      0% { transform: translate(0) }
      20% { transform: translate(-2px, 2px) }
      40% { transform: translate(-2px, -2px) }
      60% { transform: translate(2px, 2px) }
      80% { transform: translate(2px, -2px) }
      100% { transform: translate(0) }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" style="display: none;">
      <div class="hud-text" id="score-val">0</div>
    </div>

    <div id="start-menu" class="menu-screen">
      <div class="title-text">MAGNET<br>TETHER</div>
      <button class="btn" onclick="startGame(1)">1 PLAYER</button>
      <button class="btn" onclick="startGame(2)">2 PLAYER CO-OP</button>
    </div>

    <div id="game-over-screen" class="menu-screen" style="opacity: 0; pointer-events: none;">
      <div class="game-over-title">SHATTERED!</div>
      <div class="stats-label" id="final-score-val">SCORE: 0</div>
      <button class="btn" onclick="showMainMenu()" style="margin-top: 30px;">MAIN MENU</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreVal = document.getElementById("score-val");
    const uiLayer = document.getElementById("ui-layer");
    const startMenu = document.getElementById("start-menu");
    const gameOverScreen = document.getElementById("game-over-screen");
    const finalScoreVal = document.getElementById("final-score-val");

    const V_WIDTH = 360;
    const V_HEIGHT = 640;
    canvas.width = V_WIDTH;
    canvas.height = V_HEIGHT;

    // States
    let isGameOver = false;
    let isGameRunning = false;
    let mode = 1; 
    let score = 0;
    let baseSpeed = 2.5;
    let spawnTimer = 0;
    let enemies = [];
    let particles = [];
    
    // Graphical Polish Variables
    let screenShake = 0;
    let gridOffset = 0;
    let trail1 = [];
    let trail2 = [];

    // Physics
    let cx = V_WIDTH / 2;
    let cy = V_HEIGHT - 180;
    let angle = 0;
    let rotationSpeed = 0.04;
    
    let isPullingLeft = false;
    let isPullingRight = false;
    
    let minRadius = 35;
    let maxRadius = 140;
    let radiusLeft = maxRadius;
    let radiusRight = maxRadius;
    const ballRadius = 16;

    let b1 = { x: 0, y: 0 };
    let b2 = { x: 0, y: 0 };

    function startGame(selectedMode) {
      mode = selectedMode;
      startMenu.style.display = "none";
      uiLayer.style.display = "flex";
      restartData();
    }

    function showMainMenu() {
      gameOverScreen.style.opacity = "0";
      gameOverScreen.style.pointerEvents = "none";
      startMenu.style.display = "flex";
    }

    function restartData() {
      enemies = [];
      particles = [];
      trail1 = [];
      trail2 = [];
      score = 0;
      baseSpeed = 2.5;
      spawnTimer = 0;
      radiusLeft = maxRadius;
      radiusRight = maxRadius;
      isPullingLeft = false;
      isPullingRight = false;
      screenShake = 0;
      scoreVal.innerText = "0";
      isGameOver = false;
      isGameRunning = true;
    }

    function handleTouch(e, isDown) {
      if (!isGameRunning || isGameOver) return;
      let leftTouch = false;
      let rightTouch = false;

      if(e.type.includes("mouse")) {
        const x = e.clientX - canvas.getBoundingClientRect().left;
        if(mode === 1) { leftTouch = rightTouch = true; } 
        else { if(x < V_WIDTH/2) leftTouch = true; else rightTouch = true; }
      } 
      else if(e.touches) {
        if(mode === 1 && e.touches.length > 0) { leftTouch = rightTouch = true; } 
        else {
          for (let i = 0; i < e.touches.length; i++) {
            const x = e.touches[i].clientX - canvas.getBoundingClientRect().left;
            if (x < V_WIDTH/2) leftTouch = true; else rightTouch = true;
          }
        }
      }

      if (isDown) {
        if (leftTouch) isPullingLeft = true;
        if (rightTouch) isPullingRight = true;
      } else {
        isPullingLeft = leftTouch;
        isPullingRight = rightTouch;
      }
    }

    function isButton(e) { return e.target.tagName === 'BUTTON' || e.target.closest('.btn'); }

    window.addEventListener("mousedown", (e) => { if (!isButton(e)) handleTouch(e, true); });
    window.addEventListener("mouseup", (e) => { if (!isButton(e)) handleTouch(e, false); });
    window.addEventListener("touchstart", (e) => { if (!isButton(e)){ e.preventDefault(); handleTouch(e, true); }}, {passive: false});
    window.addEventListener("touchend", (e) => { if (!isButton(e)){ e.preventDefault(); handleTouch(e, false); }}, {passive: false});

    function createEnemy() {
      const radius = 18;
      const x = Math.random() * (V_WIDTH - radius * 2) + radius;
      enemies.push({ x: x, y: -40, radius: radius, rot: Math.random()*Math.PI*2 });
    }

    function createExplosion(x, y, color, amount, force) {
      for (let i = 0; i < amount; i++) {
        const ang = Math.random() * Math.PI * 2;
        const vel = (Math.random() * force) + force/2;
        particles.push({
          x: x, y: y,
          vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel,
          life: 1.0, color: color, size: Math.random() * 4 + 2
        });
      }
    }

    function triggerShake(intensity) { screenShake = intensity; }

    function triggerCrash() {
      triggerShake(15);
      isGameOver = true;
      setTimeout(() => {
        isGameRunning = false;
        uiLayer.style.display = "none";
        finalScoreVal.innerText = "SCORE: " + score;
        gameOverScreen.style.opacity = "1";
        gameOverScreen.style.pointerEvents = "auto";
      }, 800); // 0.8s death pause for dramatic effect
    }

    function isLaserCuttingEnemy(a, b, circle) {
      const distSq = (p1, p2) => (p1.x - p2.x)**2 + (p1.y - p2.y)**2;
      const lenSq = distSq(a, b);
      if (lenSq === 0) return false;
      let t = ((circle.x - a.x) * (b.x - a.x) + (circle.y - a.y) * (b.y - a.y)) / lenSq;
      t = Math.max(0, Math.min(1, t));
      const closest = { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) };
      return distSq(circle, closest) < (circle.radius * circle.radius);
    }

    function update() {
      if (!isGameRunning) return;

      // Screen Shake decay
      if(screenShake > 0) screenShake *= 0.85;
      if(screenShake < 0.5) screenShake = 0;

      if(isGameOver) return; // Stop logic, just render death animation

      angle += rotationSpeed;
      const targetLeft = isPullingLeft ? minRadius : maxRadius;
      const targetRight = isPullingRight ? minRadius : maxRadius;
      
      radiusLeft += (targetLeft - radiusLeft) * 0.18; 
      radiusRight += (targetRight - radiusRight) * 0.18; 

      b1.x = cx + Math.cos(angle) * radiusLeft;
      b1.y = cy + Math.sin(angle) * radiusLeft;
      b2.x = cx + Math.cos(angle + Math.PI) * radiusRight;
      b2.y = cy + Math.sin(angle + Math.PI) * radiusRight;

      // Store Trails
      trail1.push({x: b1.x, y: b1.y});
      trail2.push({x: b2.x, y: b2.y});
      if(trail1.length > 12) trail1.shift();
      if(trail2.length > 12) trail2.shift();

      spawnTimer++;
      const currentSpawnDelay = Math.max(35, 75 - Math.floor(score * 1.5));
      if (spawnTimer >= currentSpawnDelay) {
        createEnemy();
        spawnTimer = 0;
      }

      const activeSpeed = baseSpeed + (score * 0.06);
      gridOffset = (gridOffset + activeSpeed * 0.5) % 50;

      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.y += activeSpeed;
        en.rot += 0.05;

        // Death Hit
        if ((en.x-b1.x)**2 + (en.y-b1.y)**2 < (ballRadius + en.radius)**2 || 
            (en.x-b2.x)**2 + (en.y-b2.y)**2 < (ballRadius + en.radius)**2) {
          createExplosion(en.x, en.y, "#ff004c", 30, 8);
          triggerCrash();
          return;
        }

        // Slice Hit
        if (isLaserCuttingEnemy(b1, b2, en)) {
          createExplosion(en.x, en.y, "#00f3ff", 15, 5); // Slice spark
          triggerShake(4); // mini-shake on cut
          enemies.splice(i, 1);
          score++;
          scoreVal.innerText = score;
          scoreVal.style.transform = "scale(1.4)";
          setTimeout(()=> scoreVal.style.transform = "scale(1)", 150);
          continue;
        }

        if (en.y > V_HEIGHT + 50) enemies.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      ctx.save();
      // Apply Shake
      if (screenShake > 0) {
        ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
      }

      // Draw Dynamic Cyber Grid Background
      ctx.strokeStyle = "rgba(162, 0, 255, 0.1)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for(let x = 10; x < V_WIDTH; x+= 50) { ctx.moveTo(x, 0); ctx.lineTo(x, V_HEIGHT); }
      for(let y = gridOffset; y < V_HEIGHT; y+= 50) { ctx.moveTo(0, y); ctx.lineTo(V_WIDTH, y); }
      ctx.stroke();

      if(!isGameRunning && startMenu.style.display !== "none") {
        ctx.restore();
        return;
      }

      // Draw Light Trails
      const drawTrail = (trail) => {
        if(trail.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for(let i=1; i<trail.length; i++) { ctx.lineTo(trail[i].x, trail[i].y); }
        ctx.strokeStyle = "rgba(162, 0, 255, 0.4)";
        ctx.lineWidth = ballRadius * 1.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#a200ff";
        ctx.stroke();
      };
      drawTrail(trail1);
      drawTrail(trail2);

      // Draw Laser 
      ctx.beginPath();
      ctx.moveTo(b1.x, b1.y);
      ctx.lineTo(b2.x, b2.y);
      ctx.strokeStyle = "#00f3ff";
      ctx.lineWidth = 6;
      ctx.shadowBlur = 25;
      ctx.shadowColor = "#00f3ff";
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(b1.x, b1.y);
      ctx.lineTo(b2.x, b2.y);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.shadowBlur = 0;
      ctx.stroke();

      // Enemies (Diamond shape for cyber look)
      for (const en of enemies) {
        ctx.save();
        ctx.translate(en.x, en.y);
        ctx.rotate(en.rot);
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ff004c";
        ctx.fillStyle = "#ff004c";
        
        ctx.beginPath();
        ctx.rect(-en.radius, -en.radius, en.radius*2, en.radius*2);
        ctx.fill();
        
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.rect(-en.radius*0.4, -en.radius*0.4, en.radius*0.8, en.radius*0.8);
        ctx.fill();
        ctx.restore();
      }

      // Particles
      for (const p of particles) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }

      // Balls (Magnet Nodes)
      const drawBall = (ball) => {
        ctx.shadowBlur = 30;
        ctx.shadowColor = "#a200ff";
        ctx.fillStyle = "#a200ff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ffffff";
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballRadius * 0.4, 0, Math.PI * 2);
        ctx.fill();
      };
      
      if(!isGameOver || screenShake > 0) {
        drawBall(b1);
        drawBall(b2);
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
