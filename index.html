<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Magnet Tether</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #05050a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 420px;
      max-height: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at 50% 70%, #120a1f 0%, #030308 100%);
      box-shadow: 0 0 30px rgba(162, 0, 255, 0.15);
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
      z-index: 5;
    }
    .hud-text {
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(162, 0, 255, 0.7);
    }
    #score-val {
      font-size: 38px;
    }
    
    /* Menus */
    .menu-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 10, 0.9);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      pointer-events: auto;
      z-index: 10;
    }
    .title-text {
      font-size: 34px;
      font-weight: 900;
      color: #00f3ff;
      text-shadow: 0 0 18px rgba(0, 243, 255, 0.8);
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .btn {
      background: transparent;
      border: 2px solid #a200ff;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      padding: 12px 30px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(162, 0, 255, 0.4);
      cursor: pointer;
    }
    .btn:active {
      background: rgba(162, 0, 255, 0.3);
    }
    .game-over-title {
      font-size: 34px;
      font-weight: 900;
      color: #ff004c;
      text-shadow: 0 0 18px rgba(255, 0, 76, 0.8);
      letter-spacing: 2px;
    }
    .stats-label {
      color: #fff;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer" style="display: none;">
      <div class="hud-text" id="score-val">0</div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="menu-screen">
      <div class="title-text">MAGNET TETHER</div>
      <button class="btn" onclick="startGame(1)">1 PLAYER</button>
      <button class="btn" onclick="startGame(2)">2 PLAYER (CO-OP)</button>
    </div>

    <!-- Game Over Menu -->
    <div id="game-over-screen" class="menu-screen" style="display: none;">
      <div class="game-over-title">SHATTERED!</div>
      <div class="stats-label" id="final-score-val">SCORE: 0</div>
      <button class="btn" onclick="showMainMenu()" style="margin-top: 20px;">MAIN MENU</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreVal = document.getElementById("score-val");
    const uiLayer = document.getElementById("ui-layer");
    const startMenu = document.getElementById("start-menu");
    const gameOverScreen = document.getElementById("game-over-screen");
    const finalScoreVal = document.getElementById("final-score-val");

    const V_WIDTH = 360;
    const V_HEIGHT = 640;
    canvas.width = V_WIDTH;
    canvas.height = V_HEIGHT;

    // States
    let isGameOver = false;
    let isGameRunning = false;
    let mode = 1; // 1 = Single, 2 = Multiplayer
    let score = 0;
    let baseSpeed = 2.5;
    let spawnTimer = 0;
    let enemies = [];
    let particles = [];

    // Physics
    let cx = V_WIDTH / 2;
    let cy = V_HEIGHT - 180;
    let angle = 0;
    let rotationSpeed = 0.04;
    
    let isPullingLeft = false;
    let isPullingRight = false;
    
    let minRadius = 35;
    let maxRadius = 140;
    let radiusLeft = maxRadius;
    let radiusRight = maxRadius;
    const ballRadius = 15;

    let b1 = { x: 0, y: 0 };
    let b2 = { x: 0, y: 0 };

    function startGame(selectedMode) {
      mode = selectedMode;
      startMenu.style.display = "none";
      uiLayer.style.display = "flex";
      restartData();
    }

    function showMainMenu() {
      gameOverScreen.style.display = "none";
      startMenu.style.display = "flex";
    }

    function restartData() {
      enemies = [];
      particles = [];
      score = 0;
      baseSpeed = 2.5;
      spawnTimer = 0;
      radiusLeft = maxRadius;
      radiusRight = maxRadius;
      isPullingLeft = false;
      isPullingRight = false;
      scoreVal.innerText = "0";
      isGameOver = false;
      isGameRunning = true;
    }

    // Input Handling (Multi-touch support)
    function handleTouch(e, isDown) {
      if (!isGameRunning || isGameOver) return;
      
      let leftTouch = false;
      let rightTouch = false;

      // Mouse support
      if(e.type.includes("mouse")) {
        const x = e.clientX - canvas.getBoundingClientRect().left;
        if(mode === 1) {
          leftTouch = rightTouch = true;
        } else {
          if(x < V_WIDTH/2) leftTouch = true;
          else rightTouch = true;
        }
      } 
      // Touch support
      else if(e.touches) {
        if(mode === 1 && e.touches.length > 0) {
          leftTouch = rightTouch = true;
        } else {
          for (let i = 0; i < e.touches.length; i++) {
            const x = e.touches[i].clientX - canvas.getBoundingClientRect().left;
            if (x < V_WIDTH/2) leftTouch = true;
            else rightTouch = true;
          }
        }
      }

      if (isDown) {
        if (leftTouch) isPullingLeft = true;
        if (rightTouch) isPullingRight = true;
      } else {
        isPullingLeft = leftTouch;
        isPullingRight = rightTouch;
      }
    }

    window.addEventListener("mousedown", (e) => handleTouch(e, true));
    window.addEventListener("mouseup", (e) => handleTouch(e, false));
    window.addEventListener("touchstart", (e) => { e.preventDefault(); handleTouch(e, true); }, {passive: false});
    window.addEventListener("touchend", (e) => { e.preventDefault(); handleTouch(e, false); }, {passive: false});

    function createEnemy() {
      const radius = 16;
      const x = Math.random() * (V_WIDTH - radius * 2) + radius;
      enemies.push({ x: x, y: -30, radius: radius });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 15; i++) {
        const ang = Math.random() * Math.PI * 2;
        const vel = 2 + Math.random() * 4;
        particles.push({
          x: x, y: y,
          vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel,
          life: 1.0, color: color
        });
      }
    }

    function triggerCrash() {
      isGameOver = true;
      isGameRunning = false;
      uiLayer.style.display = "none";
      finalScoreVal.innerText = "SCORE: " + score;
      gameOverScreen.style.display = "flex";
    }

    function isLaserCuttingEnemy(a, b, circle) {
      const distSq = (p1, p2) => (p1.x - p2.x)**2 + (p1.y - p2.y)**2;
      const lenSq = distSq(a, b);
      if (lenSq === 0) return false;
      let t = ((circle.x - a.x) * (b.x - a.x) + (circle.y - a.y) * (b.y - a.y)) / lenSq;
      t = Math.max(0, Math.min(1, t));
      const closest = { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) };
      return distSq(circle, closest) < (circle.radius * circle.radius);
    }

    function isBallHittingEnemy(ball, enemy) {
      const dx = ball.x - enemy.x;
      const dy = ball.y - enemy.y;
      return (dx * dx + dy * dy) < ((ballRadius + enemy.radius)**2);
    }

    function update() {
      if (!isGameRunning) return;

      angle += rotationSpeed;
      
      const targetLeft = isPullingLeft ? minRadius : maxRadius;
      const targetRight = isPullingRight ? minRadius : maxRadius;
      
      radiusLeft += (targetLeft - radiusLeft) * 0.15; 
      radiusRight += (targetRight - radiusRight) * 0.15; 

      // b1 is the "left side" of rotation, b2 is "right side"
      b1.x = cx + Math.cos(angle) * radiusLeft;
      b1.y = cy + Math.sin(angle) * radiusLeft;
      b2.x = cx + Math.cos(angle + Math.PI) * radiusRight;
      b2.y = cy + Math.sin(angle + Math.PI) * radiusRight;

      spawnTimer++;
      const currentSpawnDelay = Math.max(40, 80 - Math.floor(score * 1.5));
      if (spawnTimer >= currentSpawnDelay) {
        createEnemy();
        spawnTimer = 0;
      }

      const activeSpeed = baseSpeed + (score * 0.05);

      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.y += activeSpeed;

        if (isBallHittingEnemy(b1, en) || isBallHittingEnemy(b2, en)) {
          createExplosion(en.x, en.y, "#ff004c");
          triggerCrash();
          return;
        }

        if (isLaserCuttingEnemy(b1, b2, en)) {
          createExplosion(en.x, en.y, "#00f3ff"); 
          enemies.splice(i, 1);
          score++;
          scoreVal.innerText = score;
          continue;
        }

        if (en.y > V_HEIGHT + 50) {
          enemies.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      if(!isGameRunning && startMenu.style.display !== "none") return;

      // Draw Laser 
      ctx.beginPath();
      ctx.moveTo(b1.x, b1.y);
      ctx.lineTo(b2.x, b2.y);
      ctx.strokeStyle = "#00f3ff";
      ctx.lineWidth = 4;
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#00f3ff";
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(b1.x, b1.y);
      ctx.lineTo(b2.x, b2.y);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 0;
      ctx.stroke();

      // Enemies
      for (const en of enemies) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ff004c";
        ctx.fillStyle = "#ff004c";
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Particles
      for (const p of particles) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
        ctx.fill();
      }

      // Balls
      const drawBall = (ball) => {
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#a200ff";
        ctx.fillStyle = "#a200ff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballRadius * 0.4, 0, Math.PI * 2);
        ctx.fill();
      };
      drawBall(b1);
      drawBall(b2);
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
