<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>গ্রাম বাজার - Village Tycoon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #1a162b;
      color: #fff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    #app-container {
      width: 100%;
      max-width: 450px;
      background: #231e3d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      position: relative;
    }
    /* Top Header Bar */
    header {
      background: #141124;
      padding: 16px 20px;
      border-bottom: 2px solid #362f59;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .bazaar-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffca28;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid #ff5252;
      color: #ff5252;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .money-display {
      font-size: 26px;
      font-weight: 900;
      color: #4caf50;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .rate-display {
      font-size: 13px;
      color: #b0bec5;
      font-weight: 600;
    }

    /* Main Scroll Area */
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    /* Shop Card */
    .shop-card {
      background: #2d264f;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #433973;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .shop-info h3 {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
    }
    .shop-level {
      font-size: 12px;
      color: #ffca28;
      font-weight: 600;
    }
    .shop-income-desc {
      font-size: 13px;
      color: #8bc34a;
      font-weight: 600;
    }

    /* Action Buttons Inside Card */
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 12px 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: transform 0.05s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .btn-sell {
      background: #0288d1;
      color: #fff;
    }
    .btn-upgrade {
      background: #388e3c;
      color: #fff;
    }
    .btn-manager {
      background: #e65100;
      color: #fff;
    }
    .btn-subtext {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.9;
    }

    /* Offline Earning Modal */
    #offline-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 8, 20, 0.88);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 50;
      text-align: center;
    }
    .modal-box {
      background: #2d264f;
      border: 1px solid #ffca28;
      border-radius: 14px;
      padding: 24px 20px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffca28;
    }
    .modal-amount {
      font-size: 28px;
      font-weight: 900;
      color: #4caf50;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <div class="header-top">
        <div class="bazaar-title">🏪 রামজীবনপুর হাট</div>
        <button class="reset-btn" onclick="resetGame()">রিসেট</button>
      </div>
      <div class="money-display" id="total-money">₹0</div>
      <div class="rate-display">আয়: <span id="total-rate">₹0</span>/সেকেন্ড</div>
    </header>

    <main id="shops-container">
      <!-- Cards will be generated via JavaScript -->
    </main>

    <!-- Offline Earnings Welcome Popup -->
    <div id="offline-modal">
      <div class="modal-box">
        <div class="modal-title">ফিরে আসার স্বাগতম!</div>
        <p style="font-size: 13px; color: #b0bec5;" id="offline-time-text">আপনি অনেকক্ষণ বাজারে ছিলেন না।</p>
        <p style="font-size: 14px;">আপনার দোকানদাররা কামাই করেছে:</p>
        <div class="modal-amount" id="offline-cash">₹0</div>
        <button class="btn btn-upgrade" style="margin-top: 10px;" onclick="closeModal()">টাকা বুঝে নিন</button>
      </div>
    </div>
  </div>

  <script>
    // Initial Shops Config
    const DEFAULT_SHOPS = [
      {
        id: "tea",
        name: "চায়ের ঠেলা",
        level: 1,
        baseIncome: 1,
        baseCost: 15,
        costMultiplier: 1.15,
        hasManager: false,
        managerCost: 50
      },
      {
        id: "pan",
        name: "পান-বিড়ির দোকান",
        level: 0,
        baseIncome: 5,
        baseCost: 100,
        costMultiplier: 1.18,
        hasManager: false,
        managerCost: 350
      },
      {
        id: "vegetable",
        name: "সবজি আড়ত",
        level: 0,
        baseIncome: 22,
        baseCost: 800,
        costMultiplier: 1.20,
        hasManager: false,
        managerCost: 2500
      },
      {
        id: "sweet",
        name: "মিষ্টির দোকান",
        level: 0,
        baseIncome: 95,
        baseCost: 4000,
        costMultiplier: 1.22,
        hasManager: false,
        managerCost: 12000
      }
    ];

    let gameState = {
      money: 0,
      lastSaved: Date.now(),
      shops: JSON.parse(JSON.stringify(DEFAULT_SHOPS))
    };

    // Load Local Storage
    function loadState() {
      const saved = localStorage.getItem("gram_bazaar_save");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          gameState.money = parsed.money || 0;
          gameState.shops = parsed.shops || DEFAULT_SHOPS;
          const timeDiffSec = Math.floor((Date.now() - (parsed.lastSaved || Date.now())) / 1000);

          // Calculate Offline Earnings
          if (timeDiffSec > 5) {
            const idleRate = calculateTotalPerSec();
            const earned = idleRate * timeDiffSec;
            if (earned > 0) {
              gameState.money += earned;
              showOfflineModal(timeDiffSec, earned);
            }
          }
        } catch (e) {
          console.error("Save load error", e);
        }
      }
    }

    function saveState() {
      gameState.lastSaved = Date.now();
      localStorage.setItem("gram_bazaar_save", JSON.stringify(gameState));
    }

    function resetGame() {
      if (confirm("আপনি কি নিশ্চিত পুরো হাট রিসেট করতে চান? সব হিসাব মুছে যাবে!")) {
        localStorage.removeItem("gram_bazaar_save");
        gameState.money = 0;
        gameState.shops = JSON.parse(JSON.stringify(DEFAULT_SHOPS));
        render();
      }
    }

    // Mathematical Helpers
    function getUpgradeCost(shop) {
      return Math.floor(shop.baseCost * Math.pow(shop.costMultiplier, shop.level));
    }

    function getShopIncome(shop) {
      return shop.level * shop.baseIncome;
    }

    function calculateTotalPerSec() {
      return gameState.shops.reduce((acc, shop) => {
        return acc + (shop.hasManager ? getShopIncome(shop) : 0);
      }, 0);
    }

    // Actions
    function manualSell(shopId) {
      const shop = gameState.shops.find(s => s.id === shopId);
      if (shop && shop.level > 0) {
        gameState.money += getShopIncome(shop);
        renderHeader();
        updateButtonStates();
      }
    }

    function upgradeShop(shopId) {
      const shop = gameState.shops.find(s => s.id === shopId);
      const cost = getUpgradeCost(shop);
      if (gameState.money >= cost) {
        gameState.money -= cost;
        shop.level++;
        render();
        saveState();
      }
    }

    function hireManager(shopId) {
      const shop = gameState.shops.find(s => s.id === shopId);
      if (shop && !shop.hasManager && gameState.money >= shop.managerCost) {
        gameState.money -= shop.managerCost;
        shop.hasManager = true;
        render();
        saveState();
      }
    }

    // Modal UI
    function showOfflineModal(seconds, earned) {
      const minutes = Math.floor(seconds / 60);
      document.getElementById("offline-time-text").innerText = `আপনি ${minutes > 0 ? minutes + " মিনিট" : seconds + " সেকেন্ড"} বাজারের বাইরে ছিলেন।`;
      document.getElementById("offline-cash").innerText = `₹${Math.floor(earned).toLocaleString("en-IN")}`;
      document.getElementById("offline-modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("offline-modal").style.display = "none";
      renderHeader();
    }

    // DOM Rendering
    function renderHeader() {
      document.getElementById("total-money").innerText = `₹${Math.floor(gameState.money).toLocaleString("en-IN")}`;
      document.getElementById("total-rate").innerText = `₹${calculateTotalPerSec().toLocaleString("en-IN")}`;
    }

    function updateButtonStates() {
      gameState.shops.forEach(shop => {
        const upCost = getUpgradeCost(shop);
        const upBtn = document.getElementById(`up-btn-${shop.id}`);
        if (upBtn) upBtn.disabled = gameState.money < upCost;

        const manBtn = document.getElementById(`man-btn-${shop.id}`);
        if (manBtn) manBtn.disabled = gameState.money < shop.managerCost;
      });
    }

    function render() {
      renderHeader();
      const container = document.getElementById("shops-container");
      container.innerHTML = "";

      gameState.shops.forEach(shop => {
        const income = getShopIncome(shop);
        const upCost = getUpgradeCost(shop);

        const card = document.createElement("div");
        card.className = "shop-card";
        card.innerHTML = `
          <div class="shop-header">
            <div class="shop-info">
              <h3>${shop.name}</h3>
              <div class="shop-level">লেভেল ${shop.level}</div>
            </div>
            <div class="shop-income-desc">
              ${income > 0 ? (shop.hasManager ? `₹${income}/সেকেন্ড (অটো)` : `₹${income}/ক্লিক`) : "বন্ধ আছে"}
            </div>
          </div>

          <div class="btn-row">
            <button class="btn btn-sell" onclick="manualSell('${shop.id}')" ${shop.level === 0 ? "disabled" : ""}>
              <span>মাল বিক্রি</span>
              <span class="btn-subtext">+₹${income > 0 ? income : 0}</span>
            </button>
            
            <button class="btn btn-upgrade" id="up-btn-${shop.id}" onclick="upgradeShop('${shop.id}')" ${gameState.money < upCost ? "disabled" : ""}>
              <span>${shop.level === 0 ? "দোকান খুলুন" : "আপগ্রেড"}</span>
              <span class="btn-subtext">খরচ: ₹${upCost.toLocaleString("en-IN")}</span>
            </button>

            ${!shop.hasManager ? `
              <button class="btn btn-manager" id="man-btn-${shop.id}" onclick="hireManager('${shop.id}')" ${gameState.money < shop.managerCost ? "disabled" : ""}>
                <span>মুন্সী নিয়োগ</span>
                <span class="btn-subtext">খরচ: ₹${shop.managerCost.toLocaleString("en-IN")}</span>
              </button>
            ` : `
              <button class="btn btn-manager" disabled style="background:#2e7d32; opacity:0.85;">
                <span>মুন্সী সক্রিয়</span>
                <span class="btn-subtext">অটো বিক্রি হচ্ছে</span>
              </button>
            `}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Engine Loops
    loadState();
    render();

    // 1-second auto income loop
    setInterval(() => {
      const perSec = calculateTotalPerSec();
      if (perSec > 0) {
        gameState.money += perSec;
        renderHeader();
        updateButtonStates();
      }
    }, 1000);

    // 5-second background auto-save loop
    setInterval(() => {
      saveState();
    }, 5000);
  </script>
</body>
</html>
