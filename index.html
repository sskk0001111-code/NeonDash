<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Magnet Tether</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #05050a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 420px;
      max-height: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at 50% 70%, #120a1f 0%, #030308 100%);
      box-shadow: 0 0 30px rgba(162, 0, 255, 0.15);
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
    }
    .hud-text {
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(162, 0, 255, 0.7);
    }
    #score-val {
      font-size: 38px;
    }
    #game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 10, 0.88);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
      z-index: 10;
    }
    .game-over-title {
      font-size: 34px;
      font-weight: 900;
      color: #ff004c;
      text-shadow: 0 0 18px rgba(255, 0, 76, 0.8);
      letter-spacing: 2px;
    }
    .stats-label {
      color: #fff;
      font-size: 18px;
      font-weight: 600;
    }
    .action-prompt {
      margin-top: 15px;
      font-size: 14px;
      color: #00f3ff;
      letter-spacing: 1px;
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
      <div>
        <div class="hud-text" id="score-val">0</div>
      </div>
    </div>

    <div id="game-over-screen">
      <div class="game-over-title">SHATTERED!</div>
      <div class="stats-label" id="final-score-val">SCORE: 0</div>
      <div class="action-prompt">TAP ANYWHERE TO RESTART</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreVal = document.getElementById("score-val");
    const gameOverScreen = document.getElementById("game-over-screen");
    const finalScoreVal = document.getElementById("final-score-val");

    const V_WIDTH = 360;
    const V_HEIGHT = 640;
    canvas.width = V_WIDTH;
    canvas.height = V_HEIGHT;

    // Game Core State
    let isGameOver = false;
    let score = 0;
    let baseSpeed = 2.5;
    let spawnTimer = 0;
    let enemies = [];
    let particles = [];

    // Magnet Tether Physics
    let cx = V_WIDTH / 2;
    let cy = V_HEIGHT - 180;
    let angle = 0;
    let rotationSpeed = 0.04;
    
    let isPulling = false;
    let minRadius = 35;
    let maxRadius = 140;
    let currentRadius = maxRadius;
    const ballRadius = 15;

    let b1 = { x: 0, y: 0 };
    let b2 = { x: 0, y: 0 };

    // Inputs
    window.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (isGameOver) {
        restartGame();
        return;
      }
      isPulling = true;
    });

    window.addEventListener("pointerup", (e) => {
      e.preventDefault();
      isPulling = false;
    });

    function restartGame() {
      enemies = [];
      particles = [];
      score = 0;
      baseSpeed = 2.5;
      spawnTimer = 0;
      currentRadius = maxRadius;
      isPulling = false;
      scoreVal.innerText = "0";
      gameOverScreen.style.display = "none";
      isGameOver = false;
    }

    function createEnemy() {
      const radius = 16;
      const x = Math.random() * (V_WIDTH - radius * 2) + radius;
      enemies.push({ x: x, y: -30, radius: radius });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 15; i++) {
        const ang = Math.random() * Math.PI * 2;
        const vel = 2 + Math.random() * 4;
        particles.push({
          x: x, y: y,
          vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel,
          life: 1.0, color: color
        });
      }
    }

    function triggerCrash() {
      isGameOver = true;
      finalScoreVal.innerText = "SCORE: " + score;
      gameOverScreen.style.display = "flex";
    }

    // Line-Circle Intersection Math
    function isLaserCuttingEnemy(a, b, circle) {
      const distSq = (p1, p2) => (p1.x - p2.x)**2 + (p1.y - p2.y)**2;
      const lenSq = distSq(a, b);
      if (lenSq === 0) return false;

      let t = ((circle.x - a.x) * (b.x - a.x) + (circle.y - a.y) * (b.y - a.y)) / lenSq;
      t = Math.max(0, Math.min(1, t));

      const closestPoint = { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) };
      return distSq(circle, closestPoint) < (circle.radius * circle.radius);
    }

    function isBallHittingEnemy(ball, enemy) {
      const dx = ball.x - enemy.x;
      const dy = ball.y - enemy.y;
      return (dx * dx + dy * dy) < ((ballRadius + enemy.radius) * (ballRadius + enemy.radius));
    }

    function update() {
      if (isGameOver) return;

      // Update Tether Physics
      angle += rotationSpeed;
      const targetRadius = isPulling ? minRadius : maxRadius;
      currentRadius += (targetRadius - currentRadius) * 0.15; // Smooth spring effect

      b1.x = cx + Math.cos(angle) * currentRadius;
      b1.y = cy + Math.sin(angle) * currentRadius;
      b2.x = cx + Math.cos(angle + Math.PI) * currentRadius;
      b2.y = cy + Math.sin(angle + Math.PI) * currentRadius;

      // Enemy Spawning
      spawnTimer++;
      const currentSpawnDelay = Math.max(40, 80 - Math.floor(score * 1.5));
      if (spawnTimer >= currentSpawnDelay) {
        createEnemy();
        spawnTimer = 0;
      }

      const activeSpeed = baseSpeed + (score * 0.05);

      // Enemy Logic
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        en.y += activeSpeed;

        // 1. Check Ball Collision (Game Over)
        if (isBallHittingEnemy(b1, en) || isBallHittingEnemy(b2, en)) {
          createExplosion(en.x, en.y, "#ff004c");
          triggerCrash();
          return;
        }

        // 2. Check Laser Collision (Slice / Score)
        if (isLaserCuttingEnemy(b1, b2, en)) {
          createExplosion(en.x, en.y, "#00f3ff"); // Blue particle explosion
          enemies.splice(i, 1);
          score++;
          scoreVal.innerText = score;
          continue;
        }

        // Remove if off screen
        if (en.y > V_HEIGHT + 50) {
          enemies.splice(i, 1);
        }
      }

      // Particles Update
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      // Draw Laser Beam
      ctx.beginPath();
      ctx.moveTo(b1.x, b1.y);
      ctx.lineTo(b2.x, b2.y);
      ctx.strokeStyle = "#00f3ff";
      ctx.lineWidth = 4;
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#00f3ff";
      ctx.stroke();

      // Draw Core Laser Line (White inside)
      ctx.beginPath();
      ctx.moveTo(b1.x, b1.y);
      ctx.lineTo(b2.x, b2.y);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 0;
      ctx.stroke();

      // Draw Enemies
      for (const en of enemies) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ff004c";
        ctx.fillStyle = "#ff004c";
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Particles
      for (const p of particles) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Magnet Balls
      const drawBall = (ball) => {
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#a200ff";
        ctx.fillStyle = "#a200ff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ballRadius * 0.4, 0, Math.PI * 2);
        ctx.fill();
      };
      drawBall(b1);
      drawBall(b2);
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
